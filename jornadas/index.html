<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadro de Jornadas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Distribuição de jornadas, escalas de revezamento, apuração de horas e conformidade com a CLT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: livro de ponto — faixa de identificação no topo, abas de índice, folhas de trabalho em largura útil */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5B6777; --line:#D6DDE5; --line-2:#E6EBF0;
  --accent:#0D5C73; --accent-ink:#FFFFFF; --accent-soft:#DCEBF0;
  --night:#3E428F; --night-soft:#E6E7F5;
  --ok:#1F7A4D; --ok-soft:#DDF0E5; --warn:#9A6400; --warn-soft:#F8ECD3; --crit:#B3261E; --crit-soft:#F8DEDB;
  --idle:#8A97A8;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151E27; --surface-2:#1A2530; --ink:#E4EAF0; --muted:#97A3B1; --line:#2A3743; --line-2:#22303B;
  --accent:#5DB6CF; --accent-ink:#0B1A20; --accent-soft:#163541;
  --night:#A5AAF2; --night-soft:#252A4D;
  --ok:#55C48D; --ok-soft:#163626; --warn:#E2A63F; --warn-soft:#3A2D14; --crit:#EF6A5F; --crit-soft:#41201D;
  --idle:#6D7B8C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151E27; --surface-2:#1A2530; --ink:#E4EAF0; --muted:#97A3B1; --line:#2A3743; --line-2:#22303B;
  --accent:#5DB6CF; --accent-ink:#0B1A20; --accent-soft:#163541;
  --night:#A5AAF2; --night-soft:#252A4D;
  --ok:#55C48D; --ok-soft:#163626; --warn:#E2A63F; --warn-soft:#3A2D14; --crit:#EF6A5F; --crit-soft:#41201D;
  --idle:#6D7B8C; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.005em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
small,.small{font-size:12px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-size:1.35rem;font-weight:700;white-space:nowrap}
.brand .stamp{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:3px;padding:1px 6px;transform:rotate(-2deg);display:inline-block}
.ident{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ident b{color:var(--ink);font-weight:600;font-family:var(--f-mono);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;width:100%;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-family:var(--f-display);font-weight:600;font-size:14px;text-decoration:none;color:var(--muted);padding:8px 14px 9px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;white-space:nowrap;position:relative;top:1px}
.tabs a:hover{color:var(--ink);background:var(--surface-2)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--bg);border-color:var(--line)}
.tabs a .cnt{font-family:var(--f-mono);font-size:11px;margin-left:6px;padding:0 5px;border-radius:8px;background:var(--crit-soft);color:var(--crit)}
.tabs a .cnt[data-zero]{background:var(--ok-soft);color:var(--ok)}

main.wrap{padding-block:22px 64px}
.view{display:flex;flex-direction:column;gap:20px}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.view-head p{max-width:68ch;color:var(--muted);margin-top:4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel>.pb{padding:16px}
.panel>.pb.flush{padding:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.grid2>*{min-width:0}
.scroll{overflow-x:auto}

/* Formulários */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{letter-spacing:.02em}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0;width:100%}
input[type="time"],input[type="number"],input[type="date"]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[type="checkbox"]{width:auto;accent-color:var(--accent)}
input:disabled,select:disabled{color:var(--muted);background:var(--surface-2)}
.btn{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:4px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--muted);padding:5px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);cursor:pointer}
.daychips{display:flex;gap:4px;flex-wrap:wrap}
.daychips label{display:inline-flex}
.daychips input{position:absolute;opacity:0;pointer-events:none}
.daychips span{font-family:var(--f-mono);font-size:12px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;cursor:pointer;color:var(--muted);user-select:none}
.daychips input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.daychips input:focus-visible+span{outline:2px solid var(--accent)}

/* Tabelas */
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
.tbl-edit td{padding:5px 6px}
.tbl-edit input,.tbl-edit select{padding:5px 6px}

/* Chips e estados */
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.r12{background:var(--night-soft);border-color:transparent;color:var(--night)}
.chip.r6{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.r5{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.sev{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px}
.sev.crit{background:var(--crit-soft);color:var(--crit)}
.sev.warn{background:var(--warn-soft);color:var(--warn)}
.sev.info{background:var(--accent-soft);color:var(--accent)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.crit .v{color:var(--crit)} .kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}

/* Grade semanal */
.grade{min-width:900px}
.grade th.dh{text-align:center;cursor:pointer}
.grade th.dh:hover{color:var(--accent)}
.grade th.dh.sel{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.grade th.dh .dt{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:0;text-transform:none}
.grade th.dh .fer{display:block;font-family:var(--f-body);font-weight:500;font-size:10px;letter-spacing:0;text-transform:none;color:var(--warn)}
.grade td.emp{white-space:nowrap;min-width:170px}
.grade td.emp b{display:block;font-weight:600}
.grade td.cell{text-align:center;cursor:pointer;padding:5px 6px;min-width:104px;position:relative}
.grade td.cell:hover{background:var(--surface-2)}
.grade td.cell.dom{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.grade td.cell.fer{background:color-mix(in srgb,var(--warn-soft) 60%,transparent)}
.cell .t{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .off{font-size:12px;color:var(--muted);font-style:italic}
.cell .man{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell .bad{position:absolute;top:3px;left:4px;width:6px;height:6px;border-radius:50%;background:var(--crit)}
.mbar{position:relative;height:6px;margin-top:4px;background:var(--line-2);border-radius:2px;overflow:hidden}
.mbar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:1px}
.mbar i.n{background:var(--night)}
.mbar .nb{position:absolute;top:0;bottom:0;background:var(--night-soft)}
.grade tfoot td{text-align:center;font-family:var(--f-mono);font-weight:500;font-size:12px}

/* Mapa de cobertura */
.heat{display:grid;grid-template-columns:64px repeat(48,minmax(9px,1fr));gap:1px;min-width:620px;font-family:var(--f-mono);font-size:11px}
.heat .hl{color:var(--muted);display:flex;align-items:center;padding-right:6px}
.heat .hc{height:20px;border-radius:1px;background:var(--surface-2)}
.heat .ht{color:var(--muted);font-size:10px;grid-column:span 6;padding-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}

/* Detalhe do dia */
.gantt{min-width:640px}
.g-row{display:grid;grid-template-columns:170px 1fr;align-items:center;min-height:28px;border-bottom:1px solid var(--line-2)}
.g-row .gl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.g-track{position:relative;height:28px}
.g-track .gn{position:absolute;top:0;bottom:0;background:var(--night-soft)}
.g-track .gg{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.g-track .gb{position:absolute;top:7px;height:14px;background:var(--accent);border-radius:2px}
.g-track .gb.n{background:var(--night)}
.g-track .gi{position:absolute;top:7px;height:14px;background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);border-radius:2px}
.g-axis{display:grid;grid-template-columns:170px 1fr}
.g-axis .ax{position:relative;height:18px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.g-axis .ax span{position:absolute;transform:translateX(-50%)}
.covchart{display:grid;grid-template-columns:170px 1fr;align-items:stretch;margin-top:10px}
.covchart .gl{font-size:12px;color:var(--muted);padding-right:8px;display:flex;flex-direction:column;justify-content:space-between}
.covchart>svg{width:100%;height:130px;display:block}

/* Alertas */
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:4px 1fr;gap:0 14px;padding:12px 16px 12px 0;border-bottom:1px solid var(--line-2)}
.alert:last-child{border-bottom:0}
.alert::before{content:"";grid-row:1/4;border-radius:0 2px 2px 0;background:var(--accent)}
.alert.crit::before{background:var(--crit)} .alert.warn::before{background:var(--warn)}
.alert .at{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.alert .at b{font-weight:600}
.alert .ad{color:var(--muted);font-size:13px;margin-top:2px;max-width:90ch}
.alert .ab{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);margin-top:4px}
.who{font-family:var(--f-display);font-weight:600;font-size:13px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Distribuição semanal */
.dist-day{display:grid;grid-template-columns:110px 70px 1fr 220px;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line-2)}
.dist-day:last-child{border-bottom:0}
.dist-day .dd{font-family:var(--f-display);font-weight:600}
.dist-day .hh{font-family:var(--f-mono);font-size:15px}
.dist-day .tl{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.dist-day.off{color:var(--muted)}
.track{position:relative;height:16px;background:var(--surface-2);border-radius:2px;overflow:hidden;border:1px solid var(--line-2)}
.track .nb{position:absolute;top:0;bottom:0;background:var(--night-soft)}
.track i{position:absolute;top:2px;bottom:2px;background:var(--accent);border-radius:1px}
.track i.n{background:var(--night)}
.models{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border-top:1px solid var(--line-2)}
.facts>div{padding:12px 16px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.facts .k{font-size:12px;color:var(--muted)}
.facts .v{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}

/* Fundamentos */
.law td:first-child{font-family:var(--f-display);font-weight:600;white-space:nowrap;vertical-align:top}
.law td{vertical-align:top}
.law td:last-child{font-family:var(--f-mono);font-size:12px;color:var(--accent);white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);max-width:90ch}

/* Editor de célula */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(380px,100%);box-shadow:0 18px 50px -12px rgba(0,0,0,.35)}
.dlg header{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.dlg .bd{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.dlg footer{padding:12px 16px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;z-index:30}

@media (max-width:720px){
  .ident{margin-left:0}
  .dist-day{grid-template-columns:90px 60px 1fr;}
  .dist-day .tl{grid-column:1/-1;text-align:left}
  .g-row,.g-axis,.covchart{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Quadro de Jornadas</h1><span class="stamp">CLT</span></div>
    <div class="ident" id="ident"></div>
    <nav class="tabs" id="tabs" aria-label="Seções">
      <a href="#escala">Escala</a>
      <a href="#apuracao">Apuração</a>
      <a href="#conformidade">Conformidade<span class="cnt" id="cnt-alertas"></span></a>
      <a href="#empresa">Empresa e demanda</a>
      <a href="#equipe">Equipe</a>
      <a href="#distribuicao">Distribuição semanal</a>
      <a href="#fundamentos">Fundamentos</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-escala" hidden></section>
  <section class="view" id="v-apuracao" hidden></section>
  <section class="view" id="v-conformidade" hidden></section>
  <section class="view" id="v-empresa" hidden></section>
  <section class="view" id="v-equipe" hidden></section>
  <section class="view" id="v-distribuicao" hidden></section>
  <section class="view" id="v-fundamentos" hidden></section>
</main>

<div class="scrim" id="editor" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ====================================================================
   Utilidades
   ==================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DIAS_L = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const SL = 15, SPD = 96, DAY = 1440;
const N_INI = 22 * 60, N_FIM = 5 * 60; // período noturno urbano: 22h–5h (art. 73, § 2º)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = s => { if (!s) return 0; const [h, m] = String(s).split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const fmtHM = m => { m = ((Math.round(m) % DAY) + DAY) % DAY; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const fmtDur = m => { m = Math.round(m); const s = m < 0 ? '−' : ''; m = Math.abs(m); const h = Math.floor(m / 60), r = m % 60; return s + h + 'h' + (r ? String(r).padStart(2, '0') : ''); };
const fmtNum = (v, d = 1) => v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = v => BRL.format(v || 0);
const uid = () => Math.random().toString(36).slice(2, 9);

/* Datas em UTC (evita deslocamentos de fuso) */
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const toISO = t => new Date(t).toISOString().slice(0, 10);
const addD = (t, n) => t + n * 864e5;
const wdOf = t => (new Date(t).getUTCDay() + 6) % 7; // 0 = segunda
const ddmm = t => { const d = new Date(t); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0'); };
const segunda = t => addD(t, -wdOf(t));
function proximaSegunda() {

  for (let s = 0; s < SPD; s++) { const k = (d * SPD + s) % N; area += ` L${x(s)},${y(cov[k])} L${x(s + 1)},${y(cov[k])}`; line += `${s ? ' L' : 'M'}${x(s)},${y(dem[k])} L${x(s + 1)},${y(dem[k])}`; }
  area += ` L${W},${y(0)} Z`;
  const gl = Array.from({ length: mx + 1 }, (_, v) => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
  const chart = `<div class="covchart"><div class="gl"><span>${mx} pessoas</span><span><svg width="10" height="10" style="display:inline;vertical-align:-1px"><rect width="10" height="10" fill="var(--accent)" opacity=".35"/></svg> escalados<br><svg width="10" height="10" style="display:inline;vertical-align:-1px"><line x1="0" x2="10" y1="5" y2="5" stroke="var(--crit)" stroke-width="2"/></svg> necessário</span><span>0</span></div>
    <svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Cobertura do dia">${gl}<path d="${area}" fill="var(--accent)" fill-opacity=".28" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/><path d="${line}" fill="none" stroke="var(--crit)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`;
  return `<div class="gantt">${rows.join('')}${axis}${chart}${axis}</div>`;
}

/* Editor de célula */
function abrirEditor(i, d) {
  const e = G.emps[i], x = G.H.days[d], sh = G.sched[i][d], key = e.id + '|' + x.iso, aj = (S.ajustes || {})[key];
  const ini = sh.w ? fmtHM(sh.ini) : (TURNOS[e.turno] ? fmtHM(Math.max(TURNOS[e.turno][0], 420)) : '08:00');
  const m = $('#editor');
  m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ed-t">
    <header><h3 id="ed-t">${esc(e.nome)}</h3><span class="muted small">${DIAS_L[x.wd]}, ${ddmm(x.t)}${x.f ? ' · ' + esc(x.f) : ''} · ${e.regime}, jornada de ${fmtDur(e.dur)}${e.brk ? ' + intervalo de ' + e.brk + ' min' : ''}</span></header>
    <div class="bd">
      <label class="chk"><input type="radio" name="ed-m" value="t" ${sh.w ? 'checked' : ''}> Trabalha neste dia</label>
      <label class="f" style="padding-left:24px"><span>Entrada</span><input type="time" id="ed-ini" value="${ini}" step="900"></label>
      <label class="chk"><input type="radio" name="ed-m" value="f" ${sh.w ? '' : 'checked'}> Folga neste dia</label>
      <p class="note">O ajuste fixa este dia; os demais dias de ${esc(e.nome.split(' ')[0])} e dos colegas são recalculados.</p>
    </div>
    <footer>${aj ? '<button class="btn ghost" id="ed-rm">Voltar ao automático</button>' : ''}<button class="btn" id="ed-x">Cancelar</button><button class="btn primary" id="ed-ok">Aplicar ajuste</button></footer></div>`;
  m.hidden = false;
  const fechar = () => { m.hidden = true; m.innerHTML = ''; };
  m.onclick = ev => { if (ev.target === m) fechar(); };
  $('#ed-x').onclick = fechar;
  if (aj) $('#ed-rm').onclick = () => { delete S.ajustes[key]; mudou(); fechar(); renderEscala(); };
  $('#ed-ok').onclick = () => {
    const modo = $('input[name="ed-m"]:checked', m).value;
    S.ajustes = S.ajustes || {};
    S.ajustes[key] = modo === 'f' ? { folga: true } : { ini: $('#ed-ini').value || '08:00' };
    mudou(); fechar(); renderEscala(); toast('Ajuste aplicado');
  };
  $('#ed-ok').focus();
}
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#editor').hidden) { $('#editor').hidden = true; $('#editor').innerHTML = ''; } });

function alertaHTML(a) {
  return `<div class="alert ${a.sev}"><div class="at"><span class="sev ${a.sev}">${{ crit: 'Infração', warn: 'Atenção', info: 'Nota' }[a.sev]}</span><b>${esc(a.titulo)}</b>${a.dias.length ? `<span class="muted small mono">${a.dias.slice(0, 10).map(esc).join(' · ')}${a.dias.length > 10 ? ` · +${a.dias.length - 10}` : ''}</span>` : ''}</div><p class="ad">${esc(a.texto)}</p><p class="ab">${esc(a.base)}</p></div>`;
}
let filtroSev = 'todos';
function renderConformidade() {
  garantir();
  const todos = [...R.empresa, ...R.pessoas.flatMap(p => p.alertas)];
  const c = s => todos.filter(a => a.sev === s).length;
  const ok = sev => filtroSev === 'todos' || filtroSev === sev;
  const blocos = [];
  const ae = R.empresa.filter(a => ok(a.sev));
  if (ae.length) blocos.push(`<div class="who">Estabelecimento</div><div class="alerts">${ae.map(alertaHTML).join('')}</div>`);
  R.pessoas.forEach(p => {
    const l = p.alertas.filter(a => ok(a.sev)); if (!l.length) return;
    blocos.push(`<div class="who">${esc(p.e.nome)} ${regChip(p.e.regime)}<span class="muted small" style="font-family:var(--f-body);font-weight:400">${esc(p.e.cargo)} · jornada de ${fmtDur(p.e.dur)}${p.e.brk ? ' + ' + p.e.brk + ' min' : ''}</span></div><div class="alerts">${l.map(alertaHTML).join('')}</div>`);
  });
  $('#v-conformidade').innerHTML = `
  <div class="view-head"><div><h2>Conformidade</h2><p>Verificação da escala contra os limites de duração do trabalho, intervalos, repousos e regimes especiais. Infrações geram passivo; notas indicam requisitos formais (acordos, normas coletivas) que a escala pressupõe.</p></div>
    <div class="seg" role="group" aria-label="Filtro">${[['todos', 'Todos (' + todos.length + ')'], ['crit', 'Infrações (' + c('crit') + ')'], ['warn', 'Atenção (' + c('warn') + ')'], ['info', 'Notas (' + c('info') + ')']].map(([k, t]) => `<button data-f="${k}" aria-pressed="${filtroSev === k}">${t}</button>`).join('')}</div></div>
  <div class="panel">${blocos.join('') || '<div class="pb muted">Nenhum apontamento nesta categoria.</div>'}</div>`;
  $$('#v-conformidade [data-f]').forEach(b => b.onclick = () => { filtroSev = b.dataset.f; renderConformidade(); });
}

/* ====================================================================
   Visão: Distribuição semanal (calculadora de jornada contratual)
   ==================================================================== */
function distCalc(Dd) {
  const dias = Dd.dias.map(Boolean), n = dias.filter(Boolean).length, tot = Math.round(Dd.semanal * 60);
  let h = [0,0,0,0,0,0,0];
  if (Dd.modo === 'personalizado') h = Dd.personalizado.map((x, k) => dias[k] ? Math.round(+x * 60) : 0);
  else if (Dd.modo === 'sabado' && dias[5] && n > 1) {
    const sab = Math.min(tot, Math.round(Dd.sabado * 60)), rest = tot - sab, outros = n - 1;
    const base = Math.floor(rest / outros), r = rest - base * outros; let c = 0;
    h = h.map((_, k) => !dias[k] ? 0 : k === 5 ? sab : base + (c++ < r ? 1 : 0));
  } else if (n) {
    const base = Math.floor(tot / n), r = tot - base * n; let c = 0;
    h = h.map((_, k) => dias[k] ? base + (c++ < r ? 1 : 0) : 0);
  }
  const ent = hm(Dd.entrada);
  const linhas = h.map((w, k) => {
    if (!w) return { k, w: 0 };
    const brk = w > 360 ? +Dd.intervalo : w > 240 ? 15 : 0;
    const bi = ent + Math.round(w / 2 / 15) * 15, sai = ent + w + brk;
    const nR = brk ? noturnos(ent, bi) + noturnos(bi + brk, sai) : noturnos(ent, sai);
    return { k, w, brk, ent, bi, bf: bi + brk, sai, nR, comp: w - nR + nR * 8 / 7 };
  });
  return { linhas, n, tot, soma: linhas.reduce((s, l) => s + (l.comp || 0), 0) };
}

function distOut() {
  const Dd = S.distrib, r = distCalc(Dd), sem = r.linhas.reduce((s, l) => s + l.w, 0);

  const pct = m => (((m % DAY) + DAY) % DAY) / DAY * 100;
  const trackSeg = (a, b, cls) => { const out = []; for (let k = 0; k <= 1; k++) { const A = Math.max(a, k * DAY), B = Math.min(b, (k + 1) * DAY); if (B > A) out.push(`<i class="${cls}" style="left:${(A - k * DAY) / DAY * 100}%;width:${(B - A) / DAY * 100}%"></i>`); } return out.join(''); };
  $('#d-out').innerHTML = r.linhas.map(l => l.w ? `<div class="dist-day"><span class="dd">${DIAS_L[l.k]}</span><span class="hh">${fmtDur(l.w)}</span>

      <span class="tl">${fmtHM(l.ent)} · ${l.brk ? `int. ${fmtHM(l.bi)}–${fmtHM(l.bf)} · ` : ''}saída ${fmtHM(l.sai)}${l.nR ? ` · ${fmtDur(l.nR)} noturnas` : ''}</span></div>`
    : `<div class="dist-day off"><span class="dd">${DIAS_L[l.k]}</span><span class="hh">—</span><div class="track"></div><span class="tl">${l.k === 6 ? 'DSR' : 'Folga / compensado'}</span></div>`).join('') +
    `<div class="facts">
      <div><div class="k">Total semanal</div><div class="v">${fmtDur(sem)}</div></div>
      <div><div class="k">Divisor mensal</div><div class="v">${fmtNum(divisor, divisor % 1 ? 1 : 0)}</div></div>
      <div><div class="k">Valor-hora</div><div class="v">${brl(vh)}</div></div>
      <div><div class="k">Hora extra 50%</div><div class="v">${brl(vh * 1.5)}</div></div>
      <div><div class="k">Hora extra 100%</div><div class="v">${brl(vh * 2)}</div></div>
      <div><div class="k">Adicional noturno/h</div><div class="v">${brl(vh * .2)}</div></div>

  // apontamentos

  if (sem !== r.tot && Dd.modo === 'personalizado') A.push({ sev: sem > r.tot ? 'crit' : 'warn', titulo: 'Soma diferente da carga semanal', texto: `A distribuição soma ${fmtDur(sem)}, contra ${fmtDur(r.tot)} contratadas.`, base: 'CF, art. 7º, XIII', dias: [] });

  if (r.n === 7) A.push({ sev: 'crit', titulo: 'Sem repouso semanal', texto: 'Todos os dias da semana foram marcados como dias de trabalho.', base: BASE.dsr7, dias: [] });

  const maior = Math.max(0, ...r.linhas.map(l => l.comp || 0));
  if (maior > 600) A.push({ sev: 'crit', titulo: 'Jornada diária acima de 10 horas', texto: `O dia mais longo soma ${fmtDur(maior)} computadas.`, base: BASE.dia10, dias: [] });
  else if (maior > 480) A.push({ sev: 'warn', titulo: 'Compensação de jornada', texto: `Dias de até ${fmtDur(maior)} pressupõem acordo de compensação: tácito ou escrito, se compensados no mesmo mês (art. 59, § 6º); individual escrito, no banco de horas semestral (§ 5º). A habitualidade de HE não descaracteriza a compensação (art. 59-B, p.u.), mas a Súmula 85 do TST segue aplicável aos fatos anteriores à Lei 13.467/2017.`, base: BASE.comp8, dias: [] });
  r.linhas.forEach(l => {

  if (r.linhas.some(l => l.nR)) A.push({ sev: 'info', titulo: 'Trabalho noturno', texto: `A jornada alcança o período das 22h às 5h: hora reduzida de 52'30" e adicional mínimo de 20%. Horas computadas na semana: ${fmtDur(r.soma)}.`, base: BASE.not, dias: [] });

  if (Dd.semanal <= 30) A.push({ sev: 'info', titulo: 'Regime de tempo parcial', texto: Dd.semanal > 26 ? 'Até 30 horas semanais, vedadas as horas suplementares.' : 'Até 26 horas semanais, admitidas até 6 horas suplementares, pagas com 50%.', base: BASE.parcial, dias: [] });

  $('#d-alertas').innerHTML = A.sort((a, b) => ord(a.sev) - ord(b.sev)).map(alertaHTML).join('') || '<div class="pb muted">Distribuição regular.</div>';
}

  let h = (location.hash || '').slice(1); if (!VIEWS[h]) h = 'escala';
  $$('.view').forEach(s => s.hidden = s.id !== 'v-' + h);
  $$('#tabs a').forEach(a => a.getAttribute('href') === '#' + h ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));

}
